[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "os-adb"
version = "0.1.0"
description = "Architecture Decision Buffer — Fast CLI/TUI tool to log architectural decisions and export ADRs."
authors = [{ name = "Andrés Delgado", email = "architect@andresdelgado.dev" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "sqlalchemy>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=10.0", "cairosvg>=2.7"]

[project.scripts]
adb = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["domain*", "engine*", "adapters*", "ui*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
